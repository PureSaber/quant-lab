[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab"
version = "0.3.1"
description = "Cross-project experiment scanner, indexer, and comparison for quant research outputs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@ad3440700b226497c40093197f1df4321b49d1e8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
statistics = ["arch>=7.2,<9"]
rolling-research = [
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@ad3440700b226497c40093197f1df4321b49d1e8",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@1c798bc737bc92fa5eca85dd0663dc608104f721",
]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.9.0", "arch>=7.2,<9", "setuptools>=68", "wheel>=0.46"]

[tool.quant-workspace]
layer = "contract"
schemas = [
    { id = "standard/v2", version = "2.0.0" },
    { id = "puresaber.run-manifest", version = "2.0.0" },
    { id = "quant.measurement/v1", version = "1.0.0" },
    { id = "quant.independent-financial-benchmarks/v1", version = "1.0.0" },
]
lock-files = ["requirements.lock", "benchmarks/requirements.lock"]

[project.scripts]
quant-lab = "quant_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=quant_lab", "--cov=quant_measurement", "--cov-branch", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.ruff]
line-length = 100
target-version = "py310"
