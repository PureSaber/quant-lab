[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab"
version = "0.3.1"
description = "Cross-project experiment scanner, indexer, and comparison for quant research outputs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
statistics = ["arch>=7.2,<9"]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.9.0", "arch>=7.2,<9", "setuptools>=68", "wheel>=0.46"]

[tool.quant-workspace]
layer = "contract"
schemas = [
    { id = "standard/v2", version = "2.0.0" },
    { id = "puresaber.run-manifest", version = "2.0.0" },
]
lock-files = ["requirements.lock"]

[project.scripts]
quant-lab = "quant_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=quant_lab", "--cov-branch", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.ruff]
line-length = 100
target-version = "py310"
